name: Validate Bicep

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'bicep/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bicep
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: Install Bicep Graph Extension
        run: |
          az extension add --name bicep
          az bicep version

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Lint Bicep files
        run: |
          echo "🔍 Linting Bicep files..."
          bicep build bicep/main.bicep
          
      - name: Validate Bicep against Azure
        run: |
          echo "✅ Validating deployment..."
          az deployment sub validate \
            --location eastus \
            --template-file bicep/main.bicep \
            --parameters bicep/parameters/parameters.dev.json \
            --name validation-${{ github.run_number }}
            
      - name: Generate Bicep Visualization
        run: |
          echo "📊 Generating deployment graph..."
          az bicep generate-params --file bicep/main.bicep --output-format json
          
      - name: Security Scan with PSRule
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: bicep/
          
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bicep-validation-results
          path: |
            *.json
            reports/
